<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 20" role="img" aria-labelledby="en-flag-title">
  <title id="en-flag-title">UK flag</title>
  <rect width="30" height="20" fill="#00247D"/>
  <g stroke="#FFFFFF" stroke-width="4">
    <line x1="0" y1="0" x2="30" y2="20"/>
    <line x1="30" y1="0" x2="0" y2="20"/>
  </g>
  <g stroke="#CF142B" stroke-width="2">
    <line x1="0" y1="0" x2="30" y2="20"/>
    <line x1="30" y1="0" x2="0" y2="20"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="6">
    <line x1="15" y1="0" x2="15" y2="20"/>
    <line x1="0" y1="10" x2="30" y2="10"/>
  </g>
  <g stroke="#CF142B" stroke-width="3.2">
    <line x1="15" y1="0" x2="15" y2="20"/>
    <line x1="0" y1="10" x2="30" y2="10"/>
  </g>
</svg>
