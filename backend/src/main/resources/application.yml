spring:
  application:
    name: onehelp-backend

  autoconfigure:
    # No UserDetailsService/AuthenticationManager bean exists yet (see SecurityConfig) —
    # without this exclusion, Spring Boot auto-configures an in-memory default user and
    # logs a fresh random password on every startup. This app will never use in-memory
    # basic auth (JWT bearer only, per ADR-1), so the auto-configuration is disabled
    # outright rather than worked around.
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:onehelp}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: ${DB_USERNAME:onehelp}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: onehelp-hikari
      connection-timeout: 10000
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      # Flyway is the only schema-authoring mechanism — Hibernate only ever verifies
      # the schema it finds matches what the entities expect.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

# Every controller in this application is mounted under /api/v1 explicitly via each
# @RequestMapping — no global server.servlet.context-path is set, so /actuator/** and
# the Swagger UI stay outside the API version prefix.
server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

onehelp:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-minutes: 15
    refresh-token-ttl-days: 30
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
